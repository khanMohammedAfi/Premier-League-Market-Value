<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premier League Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Premier League Table</h1>

  <table>
    <thead>
      <tr>
        <th>Position</th>
        <th>Club</th>
        <th>Played</th>
        <th>Won</th>
        <th>Drawn</th>
        <th>Lost</th>
        <th>GD</th>
        <th>Points</th>
      </tr>
    </thead>
    <tbody id="table-body">
     
    </tbody>
  </table>

<h2>Player Market Values</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Club</th>
        <th>Position</th>
        <th>Age</th>
       <th id="value-header">Market Value ⇅</th>
      </tr>
    </thead>
    <tbody id="players-body">
    </tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
