name: Run agent

on:
  schedule:
  - cron: "30 23 * * *"  #  05:00 AM IST, daily
  workflow_dispatch:        # lets you run it by hand to test

permissions:
  id-token: write   # OIDC login to Azure
  contents: write   # commit the updated data files
  actions: write    # start the deploy workflow

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run agent
        run: node scripts/agent.js
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}

      - name: Commit changed data
        id: commit
        run: |
          git config user.name "plmv-agent"
          git config user.email "plmv-agent@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: agent data update"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy-site.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
